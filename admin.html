<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHICMOOD MANAGEMENT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
            sans: ['Noto Sans KR', 'sans-serif']
          },
          colors: {
            warm: {
              50: '#fdf8f4', 100: '#f9efe6', 200: '#f0dcc8',
              300: '#e4c5a5', 400: '#d4a574', 500: '#c4884a',
              600: '#a86e35', 700: '#8a5628', 800: '#6b4220',
              900: '#4a2e16'
            },
            rose: {
              50: '#fdf2f4', 100: '#f9e0e5', 200: '#f0bfc8',
              400: '#c97080', 500: '#b85a6c', 600: '#9a4456'
            }
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #fdf8f4; color: #3d2e22; }

    .fade-in { animation: fadeIn 0.3s ease-out forwards; opacity: 0; }
    @keyframes fadeIn { to { opacity: 1; } }

    .spinner { width: 32px; height: 32px; border: 3px solid #f0dcc8; border-top-color: #8a5628; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .input-field { width: 100%; padding: 10px 14px; border: 1.5px solid #e4c5a5; border-radius: 6px; background: #fff; font-size: 13px; transition: border-color 0.2s; outline: none; font-family: 'Noto Sans KR', sans-serif; color: #3d2e22; }
    .input-field:focus { border-color: #8a5628; }
    .input-field::placeholder { color: #c4b09a; }

    .btn-primary { background: #6b4220; color: #fff; padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; border-radius: 6px; transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif; }
    .btn-primary:hover { background: #8a5628; }
    .btn-primary:disabled { background: #d4c5a5; cursor: not-allowed; }

    .btn-outline { background: transparent; color: #6b4220; padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid #6b4220; border-radius: 6px; transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif; }
    .btn-outline:hover { background: #6b4220; color: #fff; }

    .btn-sm { padding: 6px 14px; font-size: 12px; }
    .btn-danger { background: #dc2626; color: #fff; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; border-radius: 6px; transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif; }
    .btn-danger:hover { background: #b91c1c; }

    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .status-입금확인 { background: #fef1d1; color: #a86e35; }
    .status-결제완료 { background: #b9e4d0; color: #1a6b42; }
    .status-배송준비 { background: #dbeafe; color: #1e40af; }
    .status-배송완료 { background: #d1fae5; color: #065f46; }
    .status-결제취소 { background: #fee2e2; color: #991b1b; }
    .status-취소 { background: #fee2e2; color: #991b1b; }

    .tab { padding: 10px 10px; font-size: 13.5px; font-weight: 500; cursor: pointer; border: none; background: transparent; color: #a86e35; border-bottom: 2px solid transparent; transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif; white-space: nowrap; }
    .tab:hover { color: #6b4220; }
    .tab.active { color: #6b4220; border-bottom-color: #6b4220; font-weight: 700; }

    .filter-tab { padding: 6px 16px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1.5px solid #e4c5a5; background: #fff; color: #a86e35; border-radius: 20px; transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif; }
    .filter-tab:hover { border-color: #c4884a; }
    .filter-tab.active { background: #6b4220; color: #fff; border-color: #6b4220; }

    .card { background: #fff; border: 1px solid #f0dcc8; border-radius: 12px; padding: 20px; }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #6b4220; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 13px; font-weight: 500; z-index: 100; opacity: 0; transition: all 0.3s ease; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 신규 주문 알림 팝업 - 화면 중앙 */
    .order-noti-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 95; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
    .order-noti-overlay.show { opacity: 1; pointer-events: auto; }
    .order-noti-panel { background: #fff; border-radius: 16px; width: 380px; max-width: calc(100vw - 32px); max-height: 70vh; box-shadow: 0 20px 60px rgba(0,0,0,0.25); transform: scale(0.85); transition: transform 0.3s cubic-bezier(.4,0,.2,1); overflow: hidden; }
    .order-noti-overlay.show .order-noti-panel { transform: scale(1); }
    .order-noti-header { background: #e53e3e; color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    .order-noti-header h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .order-noti-header .noti-count { background: #fff; color: #e53e3e; font-size: 13px; font-weight: 800; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .order-noti-close { background: none; border: none; color: rgba(255,255,255,0.8); font-size: 22px; cursor: pointer; line-height: 1; padding: 0; }
    .order-noti-close:hover { color: #fff; }
    .order-noti-list { padding: 8px; max-height: calc(70vh - 120px); overflow-y: auto; }
    .order-noti-item { padding: 12px 14px; border-radius: 10px; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f0e6da; }
    .order-noti-item:last-child { border-bottom: none; }
    .order-noti-item:hover { background: #fdf8f4; }
    .order-noti-icon { width: 40px; height: 40px; background: #fef2f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .order-noti-info { flex: 1; min-width: 0; }
    .order-noti-orderno { font-size: 14px; font-weight: 700; color: #3d2e22; }
    .order-noti-detail { font-size: 12px; color: #8b7355; margin-top: 2px; }
    .order-noti-amount { font-size: 15px; font-weight: 700; color: #e53e3e; flex-shrink: 0; }
    .order-noti-footer { padding: 12px 20px; background: #fdf8f4; text-align: center; }
    .order-noti-footer button { background: #e53e3e; color: #fff; border: none; padding: 10px 32px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .order-noti-footer button:hover { background: #c53030; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 11px; font-weight: 600; color: #a86e35; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 12px; border-bottom: 2px solid #f0dcc8; }
    td { padding: 12px; border-bottom: 1px solid #f9efe6; font-size: 13px; color: #3d2e22; vertical-align: top; }
    tr:hover td { background: #fdf8f4; }

    .overlay { position: fixed; inset: 0; background: rgba(74,46,22,0.4); backdrop-filter: blur(4px); z-index: 50; display: flex; align-items: center; justify-content: center; }
    .overlay-content { animation: scaleIn 0.2s ease-out forwards; background: #fff; border-radius: 12px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; margin: 16px; }
    @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e4c5a5; border-radius: 3px; }

    /* 모바일 사이드바 */
    .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; display: none; }
    .sidebar-overlay.open { display: block; }
    .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #fff; z-index: 45; transition: left 0.3s ease; overflow-y: auto; box-shadow: 2px 0 12px rgba(0,0,0,0.1); }
    .sidebar.open { left: 0; }
    .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 12px 20px; font-size: 14px; color: #6b4220; cursor: pointer; border: none; background: none; width: 100%; text-align: left; font-family: 'Noto Sans KR', sans-serif; transition: background 0.15s; }
    .sidebar-item:hover { background: #fdf8f4; }
    .sidebar-item.active { background: #f9efe6; color: #4a2e16; font-weight: 700; }
    .hamburger { display: none; background: none; border: none; color: #fff; cursor: pointer; padding: 4px; }
    @media (max-width: 768px) {
      .hamburger { display: flex; align-items: center; }
      .desktop-tabs { display: none !important; }
    }
    @media (min-width: 769px) {
      .sidebar, .sidebar-overlay { display: none !important; }
    }

    /* 서브탭 */
    .sub-tab { padding: 8px 16px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; background: transparent; color: #a86e35; border-bottom: 2px solid transparent; transition: all 0.2s; font-family: 'Noto Sans KR', sans-serif; }
    .sub-tab:hover { color: #6b4220; }
    .sub-tab.active { color: #6b4220; border-bottom-color: #6b4220; font-weight: 700; }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>
  <div id="order-noti-overlay" class="order-noti-overlay" onclick="if(event.target===this)closeOrderNotification()">
    <div class="order-noti-panel">
      <div class="order-noti-header">
        <h3>🔔 신규 주문 <span id="order-noti-count" class="noti-count">0</span></h3>
        <button class="order-noti-close" onclick="closeOrderNotification()">&times;</button>
      </div>
      <div id="order-noti-list" class="order-noti-list"></div>
      <div class="order-noti-footer">
        <button onclick="closeOrderNotification();navigate('orders');">주문관리 바로가기</button>
      </div>
    </div>
  </div>

  <!-- 헤더 -->
  <header class="bg-warm-800 text-white">
    <div class="mx-auto px-4 sm:px-6 h-[56px] flex items-center justify-between" style="max-width:1600px;">
      <div class="flex items-center gap-3">
        <button class="hamburger" id="hamburger-btn" onclick="toggleSidebar()">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="font-serif text-xl font-semibold tracking-[0.1em] italic">CHICMOOD</span>
        <span class="text-[11px] text-warm-400 tracking-wider font-light hidden sm:inline">MANAGEMENT</span>
        <span class="text-[9px] text-warm-500 ml-2 hidden sm:inline">Ver 1.7.2</span><span class="text-[9px] text-warm-500 ml-4 hidden sm:inline">Last Modified 2026.08.24 21:27</span>
      </div>
      <button id="logout-btn" class="text-[12px] text-warm-300 hover:text-white transition-colors bg-transparent border-none cursor-pointer hidden" onclick="doLogout()">로그아웃</button>
    </div>
  </header>

  <!-- 모바일 사이드바 -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="p-4 border-b border-warm-200">
      <span class="font-serif text-lg font-semibold text-warm-800 italic">CHICMOOD</span>
    </div>
    <div class="py-2" id="sidebar-menu"></div>
  </div>

  <!-- 탭 네비게이션 (데스크톱) -->
  <nav id="main-nav" class="bg-white border-b border-warm-200 hidden">
    <div class="mx-auto px-4 sm:px-6 flex gap-0 desktop-tabs" style="max-width:1600px;overflow:hidden;">
      <button class="tab" data-tab="dashboard" onclick="navigate('dashboard')">📊 대시보드</button>
      <button class="tab" data-tab="vendors" onclick="navigate('vendors')">🏢 거래처관리</button>
      <button class="tab" data-tab="products" onclick="navigate('products')">👗 상품관리</button>
      <button class="tab" data-tab="broadcasts" onclick="navigate('broadcasts')">📺 방송관리</button>
      <button class="tab" data-tab="orders" onclick="navigate('orders')">📋 주문관리</button>
      <button class="tab" data-tab="purchase-orders" onclick="navigate('purchase-orders')">📦 발주관리</button>
      <button class="tab" data-tab="inventory" onclick="navigate('inventory')">🗄️ 재고관리</button>
      <button class="tab" data-tab="shipping" onclick="navigate('shipping')">🚚 배송관리</button>
      <button class="tab" data-tab="returns" onclick="navigate('returns')">🔄 반품관리</button>
      <button class="tab" data-tab="sales" onclick="navigate('sales')">💰 매출관리</button>
      <button class="tab" data-tab="members" onclick="navigate('members')">👥 회원관리</button>
      <button class="tab" data-tab="reports" onclick="navigate('reports')">📈 통계</button>
      <button class="tab" data-tab="system" onclick="navigate('system')">⚙️ 시스템</button>
      <button class="tab" data-tab="after-service" onclick="navigate('after-service')">🔧 A/S관리</button>
      <button class="tab" data-tab="chat" onclick="navigate('chat')">💬 Chatting</button>
    </div>
  </nav>

  <!-- 메인 -->
  <main id="page-content" class="mx-auto px-4 sm:px-6 py-8" style="max-width:1600px;"></main>
  <footer class="text-center py-6 text-[10px] text-warm-400 tracking-wider">
    <p>Developed by DK Studio</p>
  </footer>

  <script>
  // ============================================================
  //  STATE
  // ============================================================
  let adminToken = localStorage.getItem('chicmood_admin_token') || null;
  let adminUser = JSON.parse(localStorage.getItem('chicmood_admin_user') || 'null');

  // ============================================================
  //  API
  // ============================================================
  const API_BASE = '/api';

  async function api(path, options = {}) {
    const url = API_BASE + path;
    const headers = { 'Content-Type': 'application/json', ...options.headers };
    if (adminToken) headers['Authorization'] = 'Bearer ' + adminToken;
    const res = await fetch(url, { ...options, headers });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '요청에 실패했습니다');
    return data;
  }

  // ============================================================
  //  UTILS
  // ============================================================
  function fmt(n) { return '₩' + Number(n).toLocaleString('ko-KR'); }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function escapeHtml(str) {
    if (!str) return '';
    const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
  }

  function showSpinner(el) {
    el.innerHTML = '<div class="flex justify-center py-20"><div class="spinner"></div></div>';
  }

  // ============================================================
  //  ROUTER
  // ============================================================
  const NAV_ITEMS = [
    { key: 'dashboard', label: '대시보드', icon: '📊' },
    { key: 'vendors', label: '거래처관리', icon: '🏢' },
    { key: 'products', label: '상품관리', icon: '👗' },
    { key: 'broadcasts', label: '방송관리', icon: '📺' },
    { key: 'orders', label: '주문관리', icon: '📋' },
    { key: 'purchase-orders', label: '발주관리', icon: '📦' },
    { key: 'inventory', label: '재고관리', icon: '📁' },
    { key: 'shipping', label: '배송관리', icon: '🚚' },
    { key: 'returns', label: '반품관리', icon: '🔄' },
    { key: 'sales', label: '매출관리', icon: '💰' },
    { key: 'members', label: '회원관리', icon: '👥' },
    { key: 'reports', label: '통계', icon: '📈' },
    { key: 'system', label: '시스템', icon: '⚙️' },
    { key: 'after-service', label: 'A/S관리', icon: '🔧' },
    { key: 'chat', label: 'Chatting', icon: '💬' },
  ];

  function navigate(page) {
    location.hash = '#' + page;
    closeSidebar();
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('open');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
  }

  function buildSidebarMenu(activePage) {
    const menu = document.getElementById('sidebar-menu');
    if (!menu) return;
    menu.innerHTML = NAV_ITEMS.map(item =>
      `<button class="sidebar-item ${activePage === item.key ? 'active' : ''}" onclick="navigate('${item.key}')">${item.icon} ${item.label}</button>`
    ).join('');
  }

  function router() {
    stopChatPolling();
    window._chatAuth = false;
    const hash = location.hash.slice(1) || '';
    const content = document.getElementById('page-content');

    if (!adminToken || !adminUser) {
      document.getElementById('main-nav').classList.add('hidden');
      document.getElementById('logout-btn').classList.add('hidden');
      document.getElementById('hamburger-btn').style.display = 'none';
      stopOrderPolling();
      renderLogin(content);
      return;
    }

    document.getElementById('main-nav').classList.remove('hidden');
    document.getElementById('logout-btn').classList.remove('hidden');
    document.getElementById('hamburger-btn').style.display = '';

    // 주문 알림 폴링 시작 (로그인 상태일 때만)
    startOrderPolling();

    // 탭 활성화
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    const page = hash || 'dashboard';
    const activeTab = document.querySelector(`.tab[data-tab="${page}"]`);
    if (activeTab) activeTab.classList.add('active');
    buildSidebarMenu(page);

    switch (page) {
      case 'dashboard': renderDashboard(content); break;
      case 'orders': renderOrders(content); break;
      case 'shipping': renderShipping(content); break;
      case 'products': renderProducts(content); break;
      case 'vendors': renderVendors(content); break;
      case 'purchase-orders': renderPurchaseOrders(content); break;
      case 'inventory': renderInventory(content); break;
      case 'members': renderMembers(content); break;
      case 'sales': renderSales(content); break;
      case 'returns': renderReturns(content); break;
      case 'after-service': renderAfterService(content); break;
      case 'chat': renderChat(content); break;
      case 'broadcasts': renderBroadcasts(content); break;
      case 'reports': renderReports(content); break;
      case 'system': renderSystem(content); break;
      default: renderDashboard(content);
    }
  }

  window.addEventListener('hashchange', router);
  window.addEventListener('DOMContentLoaded', router);

  // ============================================================
  //  LOGIN
  // ============================================================
  function renderLogin(el) {
    el.innerHTML = `
      <div class="max-w-sm mx-auto py-20 fade-in">
        <div class="text-center mb-8">
          <h1 class="font-serif text-3xl font-semibold text-warm-900 italic mb-2">CHICMOOD</h1>
          <p class="text-[12px] text-warm-400 tracking-wider">MANAGEMENT CONSOLE</p>
        </div>
        <div class="card">
          <form onsubmit="return false;" class="space-y-4">
            <div>
              <label class="text-[11px] font-semibold tracking-wider text-warm-500 block mb-2">전화번호</label>
              <input id="login-phone" type="tel" class="input-field" placeholder="01000000000" />
            </div>
            <div>
              <label class="text-[11px] font-semibold tracking-wider text-warm-500 block mb-2">비밀번호</label>
              <input id="login-pw" type="password" class="input-field" maxlength="4" placeholder="●●●●" inputmode="numeric" />
            </div>
            <button class="btn-primary w-full" onclick="doAdminLogin()">관리자 로그인</button>
          </form>
        </div>
      </div>
    `;
  }

  async function doAdminLogin() {
    const phone = document.getElementById('login-phone').value.trim();
    const pw = document.getElementById('login-pw').value.trim();
    if (!phone || !pw) { showToast('전화번호와 비밀번호를 입력해주세요'); return; }

    try {
      const res = await api('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ phone, password: pw })
      });

      if (res.user.role !== 'admin') {
        showToast('관리자 권한이 없는 계정입니다');
        return;
      }

      adminToken = res.token;
      adminUser = res.user;
      localStorage.setItem('chicmood_admin_token', adminToken);
      localStorage.setItem('chicmood_admin_user', JSON.stringify(adminUser));
      showToast('관리자 로그인 성공');
      navigate('dashboard');
    } catch (e) {
      showToast(e.message || '로그인에 실패했습니다');
    }
  }

  function doLogout() {
    adminToken = null;
    adminUser = null;

  //  신규 주문 알림 폴링
  // ============================================================
  let orderPollingTimer = null;
  let orderLastTimestamp = new Date().toISOString();
  const notifiedOrderIds = new Set();

  function startOrderPolling() {
    if (orderPollingTimer) return; // 이미 실행 중
    orderLastTimestamp = new Date().toISOString();
    orderPollingTimer = setInterval(pollNewOrders, 10000);
  }

  function stopOrderPolling() {
    if (orderPollingTimer) {
      clearInterval(orderPollingTimer);
      orderPollingTimer = null;
    }
  }

  async function pollNewOrders() {
    if (!adminToken) return;
    try {
      const data = await api('/admin/orders?after=' + encodeURIComponent(orderLastTimestamp));
      if (data.orders && data.orders.length > 0) {
        data.orders.forEach(order => {
          if (!notifiedOrderIds.has(order.id)) {
            notifiedOrderIds.add(order.id);
            showOrderNotification(order);
          }
          // 다음 폴링 기준점 갱신
          if (order.createdAt > orderLastTimestamp) {
            orderLastTimestamp = order.createdAt;
          }
        });
      }
    } catch (e) { /* 폴링 에러 무시 */ }
  }

  let orderNotiQueue = [];
  let orderNotiAutoCloseTimer = null;

  function showOrderNotification(order) {
    // 알림음
    playNotificationSound();

    // 큐에 추가
    orderNotiQueue.push(order);

    // 팝업 목록 갱신
    const list = document.getElementById('order-noti-list');
    const countEl = document.getElementById('order-noti-count');
    if (!list || !countEl) return;

    const item = document.createElement('div');
    item.className = 'order-noti-item';
    item.onclick = () => { closeOrderNotification(); navigate('orders'); };
    item.innerHTML = `
      <div class="order-noti-icon">🛒</div>
      <div class="order-noti-info">
        <div class="order-noti-orderno">${escapeHtml(order.orderNo || '')}</div>
        <div class="order-noti-detail">${escapeHtml(order.name || '고객')}</div>
      </div>
      <div class="order-noti-amount">${fmt(order.total || 0)}</div>
    `;
    list.appendChild(item);
    countEl.textContent = orderNotiQueue.length;

    // 오버레이 표시
    const overlay = document.getElementById('order-noti-overlay');
    if (overlay && !overlay.classList.contains('show')) {
      overlay.classList.add('show');
    }

    // 자동 닫힘 타이머 리셋 (마지막 알림 기준 8초)
    if (orderNotiAutoCloseTimer) clearTimeout(orderNotiAutoCloseTimer);
    orderNotiAutoCloseTimer = setTimeout(() => closeOrderNotification(), 8000);
  }

  function closeOrderNotification() {
    const overlay = document.getElementById('order-noti-overlay');
    if (overlay) overlay.classList.remove('show');
    // 300ms 후 목록 초기화
    setTimeout(() => {
      const list = document.getElementById('order-noti-list');
      if (list) list.innerHTML = '';
      orderNotiQueue = [];
      const countEl = document.getElementById('order-noti-count');
      if (countEl) countEl.textContent = '0';
    }, 300);
    if (orderNotiAutoCloseTimer) { clearTimeout(orderNotiAutoCloseTimer); orderNotiAutoCloseTimer = null; }
  }

  function playNotificationSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.setValueAtTime(1047, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.3);
    } catch (e) { /* 소리 재생 불가 시 무시 */ }
  }

                  const totalQty = o.items.reduce((s,i) => s + i.qty, 0);

                  const allocLabel = o.status === '배송완료' ? '출고완료' : o.status === '결제취소' ? '-' : totalQty === 0 ? '-' : totalAlloc >= totalQty ? '전량배정' : totalAlloc > 0 ? '부분배정(' + totalAlloc + '/' + totalQty + ')' : '미배정';
                  const allocColor = o.status === '배송완료' ? 'color:#38a169' : o.status === '결제취소' ? 'color:#999' : totalAlloc >= totalQty && totalQty > 0 ? 'color:#38a169' : totalAlloc > 0 ? 'color:#d69e2e' : 'color:#e53e3e';
                  // Encode items data for modal
                  const itemsJson = btoa(unescape(encodeURIComponent(JSON.stringify(o.items))));
                  const orderMsgData = btoa(unescape(encodeURIComponent(JSON.stringify({
                    name: o.name, nickname: o.nickname, items: o.items.map(i => ({ name: i.name, color: i.color, size: i.size, qty: i.qty, price: i.price, subtotal: i.subtotal })),
                    subtotal: o.subtotal, shippingFee: o.shippingFee, shippingRefund: o.shippingRefund || 0, total: o.total
                  }))));
                  const mergeDisabled = ['배송완료','결제취소'].includes(o.status);
                  return `
                    <tr>
                      <td><input type="checkbox" ${mergeDisabled ? 'disabled' : ''} ${mergeChecked.has(o.id) ? 'checked' : ''} onchange="toggleMergeCheck('${o.id}', this.checked, this)" /></td>
                      <td class="font-semibold text-warm-800 text-[12px] whitespace-nowrap">${o.orderNo}</td>
                      <td class="whitespace-nowrap">
                        <p class="font-semibold">${escapeHtml(o.name)}</p>
                        <p class="text-[11px] text-warm-400">${escapeHtml(o.phone)}</p>
                      </td>
                      <td class="text-[12px] text-warm-500 whitespace-nowrap">${escapeHtml(o.nickname || '-')}</td>
                      <td class="text-[12px] text-warm-500">${itemsSummary}</td>
                      <td class="text-[12px] text-warm-500 whitespace-nowrap">${escapeHtml(o.broadcastName || '-')}</td>
                      <td class="text-[12px] text-warm-500 whitespace-nowrap">${escapeHtml(vendorNames || '-')}</td>
                      <td class="text-[11px] whitespace-nowrap">
                        ${o.items.map(i => `<span class="text-warm-500">${escapeHtml(i.name)} ${fmt(i.price)}x${i.qty}=</span><span class="font-semibold">${fmt(i.subtotal)}</span>`).join('<br>')}
                        <div class="border-t border-warm-100 mt-1 pt-1">
                          ${o.shippingFee > 0 ? `<span class="text-warm-400">배송비 ${fmt(o.shippingFee)}</span>` : `<span class="text-green-600">배송비 무료</span>`}
                          ${(o.shippingRefund||0) > 0 ? `<br><span class="text-blue-500">차감 -${fmt(o.shippingRefund)}</span>` : ''}
                          <br><span class="font-bold text-warm-800">${fmt(o.total)}</span>
                        </div>
                      </td>
                      <td><span class="status-badge status-${o.status}">${o.status}</span>${o.returnStatus ? `<br><span class="text-[9px] font-semibold ${o.returnStatus==='완료'?'text-red-500':'text-orange-500'}">반품${o.returnStatus==='완료'?'완료':'접수'}</span>` : ''}</td>
                      <td class="text-[12px] font-semibold whitespace-nowrap" style="${allocColor}">${allocLabel}</td>
                      <td class="text-warm-400 text-[12px] whitespace-nowrap">${dateStr}</td>
                      <td class="whitespace-nowrap">
                        <button class="btn-primary btn-sm" onclick="openOrderModal('${o.id}','${o.orderNo}','${o.status}','${itemsJson}')">변경</button>
                        <button class="btn-outline btn-sm" style="color:#e53e3e;border-color:#e53e3e" onclick="deleteOrder('${o.id}','${o.orderNo}')">삭제</button>
                        <button class="btn-outline btn-sm" style="font-size:10px;padding:2px 8px;color:#4a86e8;border-color:#4a86e8;" onclick="copyOrderMsg('${orderMsgData}')">주문문구</button>
                        ${o.trackingNo
                          ? `<button class="btn-outline btn-sm" style="font-size:10px;padding:2px 8px;color:#16a765;border-color:#16a765;" onclick="copyShippingMsg('${escapeHtml(o.name)}','${escapeHtml(o.trackingNo)}')">발송문구</button>`
                          : `<button class="btn-outline btn-sm" style="font-size:10px;padding:2px 8px;opacity:0.3;cursor:default;" disabled>발송문구</button>`
                        }
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>

          <!-- 페이징 -->
          ${totalPages > 1 ? `
            <div class="flex justify-center gap-2 mt-6">
              ${orderPage > 1 ? `<button class="btn-outline btn-sm" onclick="orderPage--;renderOrders(document.getElementById('page-content'))">← 이전</button>` : ''}
              <span class="text-[13px] text-warm-500 flex items-center px-4">${orderPage} / ${totalPages}</span>
              ${orderPage < totalPages ? `<button class="btn-outline btn-sm" onclick="orderPage++;renderOrders(document.getElementById('page-content'))">다음 →</button>` : ''}
            </div>
          ` : ''}
        </div>
      `;
    } catch (e) {
      el.innerHTML = '<p class="py-20 text-center text-warm-400">주문 목록을 불러오는 중 오류가 발생했습니다.</p>';
    }
  }

  let _orderModalItems = [];

  function openOrderModal(id, orderNo, currentStatus, itemsB64) {
    let items = [];
    try { items = JSON.parse(decodeURIComponent(escape(atob(itemsB64 || '')))); } catch(e) {}
    _orderModalItems = items;

    const orderStatuses = ['입금확인','결제완료','결제취소'];
    const itemStatuses = ['입금확인','결제완료','결제취소'];
    const hasItemStatus = items.some(i => i.status);

    const modal = document.createElement('div');
    modal.className = 'overlay';
    modal.id = 'order-modal';
    modal.innerHTML = `
      <div class="overlay-content p-6" style="max-width:760px;">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-serif text-lg font-semibold text-warm-800 italic">주문 상태 변경</h3>
          <button onclick="document.getElementById('order-modal').remove()" class="text-warm-400 hover:text-warm-700 bg-transparent border-none cursor-pointer text-xl">&times;</button>
        </div>
        <p class="text-[12px] text-warm-500 mb-4">주문번호: <span class="font-semibold text-warm-800">${orderNo}</span></p>

        <!-- 주문 전체 상태 -->
        <div class="card mb-4 p-4" style="background:#fdf8f4;">
          <label class="text-[11px] font-semibold tracking-wider text-warm-500 block mb-2">주문 전체 상태 (일괄 변경)</label>
          <div class="grid grid-cols-2 gap-3">
            <select id="modal-status" class="input-field">
              ${orderStatuses.map(s => `<option value="${s}" ${s === currentStatus ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
            <button class="btn-primary btn-sm" onclick="updateOrderBulk('${id}')">전체 일괄 변경</button>
          </div>
        </div>

        ${hasItemStatus ? `
        <!-- 품목별 상태 -->
        <div class="mb-4">
          <div class="flex items-center justify-between mb-2">
            <label class="text-[11px] font-semibold tracking-wider text-warm-500">품목별 상태 관리</label>
            <div class="flex gap-2">
              <label class="text-[11px] text-warm-500 flex items-center gap-1"><input type="checkbox" id="modal-check-all" onchange="toggleModalCheckAll(this.checked)" /> 전체선택</label>
              <select id="modal-bulk-status" class="input-field" style="width:auto;padding:4px 8px;font-size:11px;">
                ${itemStatuses.map(s => `<option value="${s}">${s}</option>`).join('')}
              </select>
              <button class="btn-outline btn-sm" style="padding:4px 10px;font-size:11px;" onclick="applyBulkItemStatus('${id}')">선택 일괄적용</button>
            </div>
          </div>
          <div class="overflow-x-auto border border-warm-200 rounded-lg">
            <table style="font-size:12px;">
              <thead>
                <tr>
                  <th style="padding:6px 8px;"><input type="checkbox" id="modal-check-all2" onchange="toggleModalCheckAll(this.checked)" /></th>
                  <th style="padding:6px 8px;">상품</th>
                  <th style="padding:6px 8px;">수량</th>
                  <th style="padding:6px 8px;">현재상태</th>
                  <th style="padding:6px 8px;">변경</th>
                  <th style="padding:6px 8px;"></th>
                </tr>
              </thead>
              <tbody>
                ${items.map((item, idx) => `
                  <tr>
                    <td style="padding:6px 8px;"><input type="checkbox" class="modal-item-chk" data-idx="${idx}" /></td>
                    <td style="padding:6px 8px;" class="whitespace-nowrap">${escapeHtml(item.name)} <span class="text-warm-400">${escapeHtml(item.color||'')}/${escapeHtml(item.size||'')}</span></td>
                    <td style="padding:6px 8px;">${item.qty}</td>
                    <td style="padding:6px 8px;"><span class="status-badge status-${item.status||currentStatus}" style="font-size:10px;padding:2px 8px;">${item.status||currentStatus}</span></td>
                    <td style="padding:6px 8px;">
                      <select class="input-field item-status-sel" data-idx="${idx}" style="padding:4px 6px;font-size:11px;width:auto;">
                        <option value="">변경안함</option>
                        ${itemStatuses.map(s => `<option value="${s}">${s}</option>`).join('')}
                      </select>
                    </td>
                    <td style="padding:6px 8px;">
                      <button class="btn-primary btn-sm" style="padding:3px 8px;font-size:10px;" onclick="updateSingleItem('${id}',${idx})">저장</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
        ` : `
        <p class="text-[12px] text-warm-400 mb-4">결제완료 이후 품목별 상태 관리가 활성화됩니다.</p>
        `}
      </div>
    `;
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
  }

  function toggleModalCheckAll(checked) {
    document.querySelectorAll('.modal-item-chk').forEach(cb => cb.checked = checked);
    const all1 = document.getElementById('modal-check-all');
    const all2 = document.getElementById('modal-check-all2');
    if (all1) all1.checked = checked;
    if (all2) all2.checked = checked;
  }

  async function applyBulkItemStatus(orderId) {
    const checkedIdxs = [...document.querySelectorAll('.modal-item-chk:checked')].map(cb => parseInt(cb.dataset.idx));
    if (checkedIdxs.length === 0) { showToast('품목을 선택해주세요'); return; }
    const bulkStatus = document.getElementById('modal-bulk-status').value;
    if (!bulkStatus) { showToast('상태를 선택해주세요'); return; }

    let success = 0, failed = 0;
    for (const idx of checkedIdxs) {
      const item = _orderModalItems[idx];
      if (!item || !item.id) continue;
      try {
        const body = { status: bulkStatus };
        await api(`/admin/orders/${orderId}/items/${item.id}`, {
          method: 'PATCH', body: JSON.stringify(body)
        });
        success++;
      } catch (e) { failed++; }
    }
    showToast(`${success}건 변경 완료${failed > 0 ? `, ${failed}건 실패` : ''}`);
    document.getElementById('order-modal').remove();
    renderOrders(document.getElementById('page-content'));
  }

  async function updateSingleItem(orderId, idx) {
    const item = _orderModalItems[idx];
    if (!item || !item.id) { showToast('품목 정보가 없습니다'); return; }

    const statusSel = document.querySelector(`.item-status-sel[data-idx="${idx}"]`);

    const body = {};
    if (statusSel && statusSel.value) body.status = statusSel.value;

    if (!body.status) { showToast('변경할 상태를 선택해주세요'); return; }

    try {
      await api(`/admin/orders/${orderId}/items/${item.id}`, {
        method: 'PATCH', body: JSON.stringify(body)
      });
      showToast('품목 상태가 변경되었습니다');
      document.getElementById('order-modal').remove();
      renderOrders(document.getElementById('page-content'));
    } catch (e) {
      showToast(e.message || '변경에 실패했습니다');
    }
  }

  async function updateOrderBulk(id) {
    const status = document.getElementById('modal-status').value;

    try {
      await api('/admin/orders/' + id, {
        method: 'PATCH',
        body: JSON.stringify({ status })
      });
      document.getElementById('order-modal').remove();
      showToast('주문 상태가 변경되었습니다');
      renderOrders(document.getElementById('page-content'));
    } catch (e) {
      showToast(e.message || '상태 변경에 실패했습니다');
    }
  }

  function getRowStatus(cb) {
    const row = cb.closest('tr');
    return row?.querySelector('.status-badge')?.textContent?.trim() || '';
  }

  function toggleMergeCheck(id, checked, cbEl) {
    if (checked && mergeChecked.size > 0) {
      // 이미 선택된 주문의 상태와 비교
      const newStatus = cbEl ? getRowStatus(cbEl) : '';
      const existingCb = document.querySelector('tbody input[type="checkbox"]:checked:not(:disabled)');
      const existingStatus = existingCb ? getRowStatus(existingCb) : '';
      if (newStatus && existingStatus && newStatus !== existingStatus) {
        showToast(`상태가 다른 주문은 함께 선택할 수 없습니다 (${existingStatus} ≠ ${newStatus})`);
        if (cbEl) cbEl.checked = false;
        return;
      }
    }
    if (checked) mergeChecked.add(id); else mergeChecked.delete(id);
    const counter = document.getElementById('merge-counter');
    if (counter) counter.textContent = mergeChecked.size > 0 ? mergeChecked.size + '건 선택' : '';
  }

  function toggleAllMerge(checked) {
    if (!checked) {
      mergeChecked.clear();
      document.querySelectorAll('tbody input[type="checkbox"]:not(:disabled)').forEach(cb => { cb.checked = false; });
    } else {
      // 첫 번째 활성 체크박스의 상태를 기준으로 같은 상태만 선택
      const allCbs = [...document.querySelectorAll('tbody input[type="checkbox"]:not(:disabled)')];
      const firstStatus = allCbs.length > 0 ? getRowStatus(allCbs[0]) : '';
      let skipped = 0;
      allCbs.forEach(cb => {
        const status = getRowStatus(cb);
        if (status !== firstStatus) { cb.checked = false; skipped++; return; }
        cb.checked = true;
        const id = cb.getAttribute('onchange').match(/'([^']+)'/)?.[1];
        if (id) mergeChecked.add(id);
      });
      if (skipped > 0) showToast(`상태가 다른 ${skipped}건은 선택에서 제외되었습니다 (기준: ${firstStatus})`);
    }
    const counter = document.getElementById('merge-counter');
    if (counter) counter.textContent = mergeChecked.size > 0 ? mergeChecked.size + '건 선택' : '';
  }

  async function mergeOrders() {
    if (mergeChecked.size < 2) {
      showToast('병합할 주문을 2건 이상 선택해주세요');
      return;
    }
    const ids = [...mergeChecked];
    // 선택된 주문의 주문자 정보 확인 (현재 테이블 행에서 추출)
    const rows = document.querySelectorAll('tbody tr');
    const selectedInfo = [];
    rows.forEach(row => {
      const cb = row.querySelector('input[type="checkbox"]');
      if (!cb || !cb.checked || cb.disabled) return;
      const onchange = cb.getAttribute('onchange') || '';
      const idMatch = onchange.match(/'([^']+)'/);
      if (!idMatch) return;
      const orderId = idMatch[1];
      if (!mergeChecked.has(orderId)) return;
      const cells = row.querySelectorAll('td');
      const name = cells[2]?.querySelector('p')?.textContent?.trim() || '';
      const phone = cells[2]?.querySelector('p:nth-child(2)')?.textContent?.trim() || '';
      const status = cells[8]?.querySelector('.status-badge')?.textContent?.trim() || '';
      selectedInfo.push({ id: orderId, name, phone, status });
    });

    // 프론트 검증: 같은 주문자인지
    const firstName = selectedInfo[0]?.name;
    const firstPhone = selectedInfo[0]?.phone;
    const allSame = selectedInfo.every(s => s.name === firstName && s.phone === firstPhone);
    if (!allSame) {
      showToast('같은 주문자(이름+연락처)의 주문만 병합할 수 있습니다');
      return;
    }

    // 프론트 검증: 같은 상태인지
    const firstStatus = selectedInfo[0]?.status;
    const allSameStatus = selectedInfo.every(s => s.status === firstStatus);
    if (!allSameStatus) {
      const statusList = selectedInfo.map(s => `${s.id.slice(-4)}: ${s.status}`).join(', ');
      showToast(`상태가 다른 주문은 병합할 수 없습니다 (${[...new Set(selectedInfo.map(s => s.status))].join(' / ')})`);
      return;
    }

    if (!confirm(`${firstName}(${firstPhone})님의 주문 ${ids.length}건을 병합하시겠습니까?\n첫 번째 주문에 나머지 품목이 합쳐지고, 나머지 주문은 삭제됩니다.`)) return;

    try {
      const targetId = ids[0];
      const sourceIds = ids.slice(1);
      await api('/admin/orders/merge', {
        method: 'POST',
        body: JSON.stringify({ targetId, sourceIds })
      });
      showToast(`${ids.length}건의 주문이 병합되었습니다`);
      mergeChecked.clear();
      renderOrders(document.getElementById('page-content'));
    } catch (e) {
      showToast(e.message || '주문 병합에 실패했습니다');
    }
  }

  async function deleteOrder(id, orderNo) {
    if (!confirm(`주문 ${orderNo}을(를) 삭제하시겠습니까?\n연관된 발주 수량도 함께 차감됩니다.`)) return;
    try {
      await api('/admin/orders/' + id, { method: 'DELETE' });
      showToast('주문이 삭제되었습니다');
      renderOrders(document.getElementById('page-content'));
    } catch (e) { showToast(e.message || '삭제에 실패했습니다'); }
  }

  // ============================================================
  //  SHIPPING (배송관리 + 로젠택배 엑셀)
  // ============================================================
  let shippingFilter = '배송준비';
  let shippingFrom = '';
  let shippingTo = '';
  let shippingSearch = '';
  let shippingPage = 1;
  let shippingChecked = new Set(); // orderId (주문 단위)
  let _shippingOrderKeys = [];
  let _shippingOrders = [];

  async function renderShipping(el) {
    showSpinner(el);
    try {
      const params = new URLSearchParams({ page: shippingPage, limit: 50 });
      if (shippingFilter !== 'all') params.set('status', shippingFilter);
      if (shippingFrom) params.set('from', shippingFrom);
      if (shippingTo) params.set('to', shippingTo);
      if (shippingSearch) params.set('search', shippingSearch);

      const data = await api('/admin/orders?' + params.toString());
      _shippingOrders = data.orders;
      _shippingOrderKeys = [];
      const statuses = ['all','배송준비','배송완료'];
      const statusLabels = { all:'전체', 배송준비:'배송준비', 배송완료:'배송완료' };
      const totalPages = Math.ceil(data.total / data.limit);

      // Build order-level rows (1 order = 1 row)
      let orderRows = '';
      data.orders.forEach(o => {
        const key = o.id;
        _shippingOrderKeys.push(key);
        const itemSummary = o.items.map(item => `${escapeHtml(item.name)}(${escapeHtml(item.color||'')}/${escapeHtml(item.size||'')})x${item.qty}`).join('<br>');
        const trackingCol = o.status === '배송완료'
          ? `<div class="flex items-center gap-1"><span class="text-[12px]">${escapeHtml(o.trackingNo||'')}</span><button class="btn-outline" style="padding:2px 6px;font-size:10px;color:#b91c1c;" onclick="revertShipping('${key}','${escapeHtml(o.orderNo)}')">취소</button></div>`
          : `<div class="flex items-center gap-1"><input type="text" class="input-field" style="width:120px;padding:4px 6px;font-size:12px;" placeholder="송장번호" id="track-${key}" onkeydown="if(event.key==='Enter'){event.preventDefault();saveTrackingNo('${key}')}" /><button class="btn-primary" style="padding:4px 8px;font-size:11px;white-space:nowrap;" onclick="saveTrackingNo('${key}')">저장</button></div>`;
        const shipMsgBtn = o.trackingNo
          ? `<button class="btn-outline btn-sm" style="font-size:10px;padding:2px 8px;color:#16a765;border-color:#16a765;" onclick="copyShippingMsg('${escapeHtml(o.name)}','${escapeHtml(o.trackingNo)}')">발송문구</button>`
          : '';
        orderRows += `
          <tr>
            <td><input type="checkbox" class="ship-chk" value="${key}" ${shippingChecked.has(key)?'checked':''} onchange="toggleShippingCheck('${key}',this.checked)" /></td>
            <td class="font-semibold text-warm-800 text-[12px] whitespace-nowrap">${o.orderNo}</td>
            <td class="whitespace-nowrap font-semibold">${escapeHtml(o.name)}</td>
            <td class="text-[12px] whitespace-nowrap">${escapeHtml(o.phone)}</td>
            <td class="text-[12px] text-warm-500">${itemSummary}</td>
            <td><span class="status-badge status-${o.status}" style="font-size:10px;padding:2px 8px;">${o.status}</span></td>
            <td class="whitespace-nowrap">${trackingCol}</td>
            <td class="whitespace-nowrap">${shipMsgBtn}</td>
          </tr>`;
      });

      el.innerHTML = `
        <div class="fade-in">
          <div class="flex flex-wrap justify-between items-center mb-6 gap-3">

            <div class="flex gap-2">

  function toggleShippingCheck(key, checked) {
    if (checked) shippingChecked.add(key); else shippingChecked.delete(key);

    if (cnt) cnt.textContent = shippingChecked.size;
  }
  function toggleAllShipping(checked) {
    _shippingOrderKeys.forEach(key => { if (checked) shippingChecked.add(key); else shippingChecked.delete(key); });
    document.querySelectorAll('.ship-chk').forEach(cb => cb.checked = checked);
    const cnt = document.getElementById('ship-count');
    if (cnt) cnt.textContent = shippingChecked.size;
  }

  async function saveTrackingNo(orderId) {
    const inp = document.getElementById('track-' + orderId);
    if (!inp) return;
    const trackingNo = inp.value.trim();
    if (!trackingNo) return;
    // 중복 호출 방지 (blur + Enter)
    if (inp.dataset.saving) return;
    inp.dataset.saving = '1';
    try {
      await api('/admin/orders/' + orderId, {
        method: 'PATCH',
        body: JSON.stringify({ status: '배송완료', trackingNo, trackingCarrier: '로젠택배' })
      });
      showToast('송장번호 저장 완료');
      renderShipping(document.getElementById('page-content'));
    } catch (e) {
      showToast(e.message || '송장번호 저장 실패');
      delete inp.dataset.saving;
    }
  }

  async function saveAllTrackingNo() {
    const inputs = document.querySelectorAll('[id^="track-"]');
    const toSave = [];
    inputs.forEach(inp => {
      const val = inp.value.trim();
      if (val) toSave.push({ id: inp.id.replace('track-', ''), trackingNo: val });
    });
    if (toSave.length === 0) { showToast('저장할 송장번호가 없습니다'); return; }
    if (!confirm(`${toSave.length}건의 송장번호를 저장하시겠습니까?`)) return;
    let success = 0, fail = 0;
    for (const item of toSave) {
      try {
        await api('/admin/orders/' + item.id, {
          method: 'PATCH',
          body: JSON.stringify({ status: '배송완료', trackingNo: item.trackingNo, trackingCarrier: '로젠택배' })
        });
        success++;
      } catch (e) { fail++; }
    }
    showToast(`저장 완료: ${success}건${fail > 0 ? `, 실패: ${fail}건` : ''}`);
    renderShipping(document.getElementById('page-content'));
  }

  function copyOrderMsg(dataB64) {
    const d = JSON.parse(decodeURIComponent(escape(atob(dataB64))));
    const displayName = d.nickname && d.nickname !== '-' ? d.nickname : d.name;
    let msg = '----------------------------------\n';
    msg += `[ ${displayName}님 최종 정산서 ]\n`;
    d.items.forEach(i => {
      msg += `- ${i.name}(${i.color}/${i.size}) : ${fmt(i.subtotal)}원\n`;
    });
    msg += `\n상품가격 : ${fmt(d.subtotal)}원\n`;
    if (d.shippingFee === 0 && d.subtotal < 100000) {
      msg += '배송비 : 0원 (합배송 적용 - 배송비 면제)\n';
    } else if (d.shippingFee === 0) {
      msg += '배송비 : 0원 (무료배송)\n';
    } else {
      msg += `배송비 : ${fmt(d.shippingFee)}원\n`;
    }
    if (d.shippingRefund > 0 && d.shippingFee > 0) {
      msg += `선구매 배송비 차감 : -${fmt(d.shippingRefund)}원\n`;
    }
    msg += `총 결제액: ${fmt(d.total)}원\n`;
    msg += '----------------------------------';
    navigator.clipboard.writeText(msg).then(() => {
      showToast('주문문구가 복사되었습니다');
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = msg; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('주문문구가 복사되었습니다');
    });
  }

  function copyShippingMsg(name, trackingNo) {
    const msg = `[시크무드]\n${name}님, 주문하신 상품이 오늘\n로젠택배로 발송되었습니다.\n\n송장번호: ${trackingNo}\n(조회는 늦은 오후나 내일 오전부터 가능할 수 있습니다.)\n\n시크무드를 이용해주셔서\n감사합니다.`;
    navigator.clipboard.writeText(msg).then(() => {
      showToast('발송문구가 복사되었습니다');
    }).catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = msg; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('발송문구가 복사되었습니다');

  }

  async function uploadTrackingExcel(input) {
    const file = input.files[0];
    if (!file) return;
    input.value = ''; // 같은 파일 재선택 가능하도록 초기화

    try {
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const allRows = XLSX.utils.sheet_to_json(ws, { header: 1 });

      // Row 3부터 데이터 (Row 0: 타이틀, Row 1-2: 헤더)
      const rows = [];
      for (let i = 3; i < allRows.length; i++) {
        const r = allRows[i];
        if (!r || r.length === 0) continue;
        const trackingNo = r[3]; // D열: 운송장번호
        const name = r[6];      // G열: 수하인 이름
        const phone = r[9];     // J열: 수하인 전화
        if (!trackingNo) continue; // 운송장 없으면 스킵
        rows.push([String(trackingNo), String(name || ''), String(phone || '')]);
      }

      if (rows.length === 0) { showToast('유효한 운송장 데이터가 없습니다'); return; }
      if (!confirm(`${rows.length}건의 운송장 데이터를 업로드하시겠습니까?`)) return;

      const result = await api('/admin/shipping-import', {
        method: 'POST',
        body: JSON.stringify({ rows })
      });

      const details = result.details || [];
      const successList = details.filter(d => d.result === '성공');
      const skippedList = details.filter(d => d.reason);
      let msg = '';
      if (successList.length > 0) {
        const names = successList.map(d => d.name);
        const preview = names.length <= 3 ? names.join(', ') : names.slice(0, 3).join(', ') + ' 등';
        msg = `${preview} ${successList.length}건 배송완료 처리됨`;
      }
      if (result.skipped > 0) msg += (msg ? '\n' : '') + `스킵: ${result.skipped}건`;
      if (result.failed > 0) msg += (msg ? '\n' : '') + `실패: ${result.failed}건`;
      if (successList.length > 0) {
        alert(msg);
      } else {
        showToast(msg || '처리된 건이 없습니다');
        if (skippedList.length > 0) alert('매칭 실패 상세:\n' + skippedList.map(d => `${d.name||''}: ${d.reason}`).join('\n'));
      }
      renderShipping(document.getElementById('page-content'));
    } catch (e) {
      showToast(e.message || '운송장 업로드에 실패했습니다');
    }
  }

  async function downloadLozenExcel() {
    if (shippingChecked.size === 0) { showToast('엑셀로 내보낼 주문을 선택해주세요'); return; }
    try {
      const orderIds = Array.from(shippingChecked);
      const data = await api('/admin/shipping-excel', {
        method: 'POST',
        body: JSON.stringify({ orderIds })
      });
      const rows = data.rows || [];
      if (rows.length === 0) { showToast('내보낼 데이터가 없습니다'); return; }

      // 로젠택배 엑셀 형식 (헤더 없이 데이터만 – 로젠 업로드 양식)
      const ws = XLSX.utils.aoa_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '로젠택배');

      // 컬럼 너비 설정
      ws['!cols'] = [
        {wch:10},{wch:3},{wch:40},{wch:14},{wch:14},{wch:5},{wch:7},{wch:5},{wch:40},{wch:3},{wch:20}
      ];

      const today = new Date();
      const fname = `로젠택배_${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}.xlsx`;
      const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      const blob = new Blob([wbout], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fname; a.click();
      URL.revokeObjectURL(url);
      showToast(`${rows.length}건 엑셀 다운로드 완료`);
    } catch (e) {
      showToast(e.message || '엑셀 생성에 실패했습니다');
    }
  }

  async function handleImageUpload(files) {
    if (!files || files.length === 0) return;
    const statusEl = document.getElementById('pm-upload-status');
    statusEl.classList.remove('hidden');

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      statusEl.textContent = `업로드 중... (${i+1}/${files.length}) ${file.name}`;

      try {
        // 1. 서명 URL 받기
        const { signedUrl, token, publicUrl } = await api('/images/upload-url', {
          method: 'POST',
          body: JSON.stringify({ filename: file.name, contentType: file.type })
        });

        // 2. 파일 업로드
        const uploadRes = await fetch(signedUrl, {
          method: 'PUT',
          headers: { 'Content-Type': file.type },
          body: file
        });

        if (!uploadRes.ok) throw new Error('업로드 실패');

        // 3. 목록에 추가
        pmImageUrls.push(publicUrl);
        renderImagePreviews();
      } catch (e) {
        showToast(`${file.name} 업로드 실패: ${e.message}`);
      }
    }
    statusEl.textContent = `${files.length}장 업로드 완료`;
    setTimeout(() => statusEl.classList.add('hidden'), 2000);
  }

  async function saveProduct(id) {
    const name = document.getElementById('pm-name').value.trim();
    const material = document.getElementById('pm-material').value.trim();
    const vendorId = document.getElementById('pm-vendor').value ? parseInt(document.getElementById('pm-vendor').value) : null;

    const wholesalePrice = parseInt(document.getElementById('pm-wholesale').value) || 0;
    const aqVal = document.getElementById('pm-available-qty').value.trim();
    const availableQty = aqVal === '' ? null : Math.max(0, parseInt(aqVal) || 0);
    const sizeChecked = [...document.querySelectorAll('.pm-size-cb:checked')].map(cb => cb.value);
    const size = sizeChecked.join(',');
    const price = wholesalePrice || costPrice;
    const originalPrice = wholesalePrice || costPrice;
    const discount = 0;
    const description = '';

    const images = pmImageUrls.filter(Boolean);
    const colorCbs = [...document.querySelectorAll('.pm-color-cb:checked')];
    const colors = colorCbs.map(cb => ({ name: cb.value, hex: cb.dataset.hex }));

    if (!name) { showToast('상품명은 필수입니다'); return; }

    try {

        <div class="flex justify-between items-center mb-6">
          <h3 class="font-serif text-lg font-semibold text-warm-800 italic">${isEdit ? '거래처 수정' : '거래처 등록'}</h3>
          <button onclick="document.getElementById('vendor-modal').remove()" class="text-warm-400 hover:text-warm-700 bg-transparent border-none cursor-pointer text-xl">&times;</button>
        </div>
        <form onsubmit="return false;" class="space-y-4">
          <div>
            <label class="text-[11px] font-semibold tracking-wider text-warm-500 block mb-1">거래처명 *</label>
            <input id="vm-name" class="input-field" value="${escapeHtml(v.name)}" placeholder="거래처명" />
          </div>
          <div>
            <label class="text-[11px] font-semibold tracking-wider text-warm-500 block mb-1">연락처</label>
            <input id="vm-phone" class="input-field" value="${escapeHtml(v.phone||'')}" placeholder="010-0000-0000" />
          </div>
          <div>
            <label class="text-[11px] font-semibold tracking-wider text-warm-500 block mb-1">거래처주소</label>
            <input id="vm-address" class="input-field" value="${escapeHtml(v.address||'')}" placeholder="거래처 주소" />
          </div>
          <div>
            <label class="text-[11px] font-semibold tracking-wider text-warm-500 block mb-1">입금계좌</label>
            <input id="vm-bank" class="input-field" value="${escapeHtml(v.bankInfo||'')}" placeholder="은행 계좌번호 예금주" />
          </div>
          <div>
            <label class="text-[11px] font-semibold tracking-wider text-warm-500 block mb-1">메모</label>
            <textarea id="vm-memo" class="input-field resize-none" rows="2">${escapeHtml(v.memo||'')}</textarea>
          </div>
          <button class="btn-primary w-full" onclick="saveVendor(${isEdit ? v.id : 'null'})">${isEdit ? '수정' : '등록'}</button>
        </form>
      </div>
    `;
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
  }

  let _savingVendor = false;
  async function saveVendor(id) {
    if (_savingVendor) return;
    _savingVendor = true;
    const name = document.getElementById('vm-name').value.trim();
    if (!name) { _savingVendor = false; showToast('거래처명은 필수입니다'); return; }
    const body = {
      name,
      contact: '',
      phone: document.getElementById('vm-phone').value.trim(),
      email: '',
      address: document.getElementById('vm-address').value.trim(),
      bankInfo: document.getElementById('vm-bank').value.trim(),
      memo: document.getElementById('vm-memo').value.trim(),
    };
    try {
      if (id) {
        await api('/admin/vendors/' + id, { method: 'PATCH', body: JSON.stringify(body) });
        showToast('거래처가 수정되었습니다');
      } else {
        await api('/admin/vendors', { method: 'POST', body: JSON.stringify(body) });
        showToast('거래처가 등록되었습니다');
      }
      vendorListCache = null; // 거래처 목록 캐시 초기화
      document.getElementById('vendor-modal').remove();
      renderVendors(document.getElementById('page-content'));
    } catch (e) { showToast(e.message || '저장에 실패했습니다'); } finally { _savingVendor = false; }
  }

  async function deleteVendor(id) {
    if (!confirm('이 거래처를 삭제하시겠습니까?')) return;
    try {
      await api('/admin/vendors/' + id, { method: 'DELETE' });
      vendorListCache = null; // 거래처 목록 캐시 초기화
      showToast('거래처가 삭제되었습니다');
      renderVendors(document.getElementById('page-content'));
    } catch (e) { showToast(e.message || '삭제에 실패했습니다'); }
  }

  // ============================================================
  //  PURCHASE ORDERS (발주관리)
  // ============================================================
  let poFilter = 'all';
  let poPage = 1;
  let poSearch = '';
  let poBroadcastFilter = 'live'; // 기본: 방송중 발주만

  async function renderPurchaseOrders(el) {
    showSpinner(el);
    try {
      const params = new URLSearchParams({ page: poPage, limit: 20 });
      if (poFilter !== 'all') params.set('status', poFilter);
      if (poBroadcastFilter === 'live') params.set('broadcastFilter', 'live');
      if (poSearch) params.set('search', poSearch);
      const data = await api('/admin/purchase-orders?' + params.toString());
      const totalPages = Math.ceil(data.total / data.limit);
      const statuses = ['all','발주대기','입고완료'];
      const statusLabels = { all:'전체', 발주대기:'발주대기', 입고완료:'입고완료' };

      el.innerHTML = `
        <div class="fade-in">
          <div class="flex justify-between items-center mb-6">
            <h2 class="font-serif text-2xl font-semibold text-warm-900 italic">발주관리</h2>
            <div class="flex gap-2">
              <button class="btn-outline btn-sm" onclick="renderPurchaseOrders(document.getElementById('page-content'))">🔄 새로고침</button>
              <button class="btn-primary" onclick="openPOModal()">+ 발주서 작성</button>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-3 mb-4">
            <div class="flex flex-wrap gap-2">
              <button class="filter-tab ${poBroadcastFilter==='live'?'active':''}" onclick="poBroadcastFilter='live';poPage=1;renderPurchaseOrders(document.getElementById('page-content'))">방송중</button>
              <button class="filter-tab ${poBroadcastFilter==='all'?'active':''}" onclick="poBroadcastFilter='all';poPage=1;renderPurchaseOrders(document.getElementById('page-content'))">전체</button>
              <span class="text-warm-300 mx-1">|</span>
              ${statuses.map(s => `<button class="filter-tab ${poFilter===s?'active':''}" onclick="poFilter='${s}';poPage=1;renderPurchaseOrders(document.getElementById('page-content'))">${statusLabels[s]}</button>`).join('')}
            </div>
            <input type="text" class="input-field" style="max-width:260px;" placeholder="발주번호, 거래처명 검색..." value="${escapeHtml(poSearch)}" onkeydown="if(event.key==='Enter'){poSearch=this.value;poPage=1;renderPurchaseOrders(document.getElementById('page-content'))}" />
          </div>
          <div class="card overflow-x-auto">
            <table>
              <thead><tr><th>발주번호</th><th>거래처</th><th>품목</th><th>발주/입고</th><th>상태</th><th>금액</th><th>메모</th><th>발주일</th><th>관리</th></tr></thead>
              <tbody>
                ${(data.purchaseOrders||[]).length === 0 ? '<tr><td colspan="9" class="text-center text-warm-400 py-12">발주서가 없습니다</td></tr>' : ''}
                ${(data.purchaseOrders||[]).map(po => {
                  const d = po.orderedAt ? new Date(po.orderedAt) : (po.createdAt ? new Date(po.createdAt) : null);
                  const ds = d ? `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}` : '-';
                  const itemsHtml = (po.itemsSummary||[]).length > 0
                    ? (po.itemsSummary.length <= 2
                        ? po.itemsSummary.map(s => escapeHtml(s)).join('<br>')
                        : po.itemsSummary.slice(0,2).map(s => escapeHtml(s)).join('<br>') + `<br><span class="text-warm-400">외 ${po.itemsSummary.length - 2}건</span>`)
                    : '-';
                  const qtyLabel = `${po.totalQty||0} / ${po.totalReceivedQty||0}`;
                  const qtyDone = (po.totalQty||0) > 0 && (po.totalReceivedQty||0) >= (po.totalQty||0);
                  return `
                    <tr>
                      <td class="font-semibold text-warm-700 text-[12px] cursor-pointer hover:text-warm-900 hover:underline" onclick="openPODetailModal(${po.id})">${escapeHtml(po.poNo)}</td>
                      <td>${escapeHtml(po.vendorName||'')}</td>
                      <td class="text-[12px] text-warm-500 max-w-[200px]">${itemsHtml}</td>
                      <td class="text-[13px] font-semibold">${qtyDone ? '<span class="text-green-600">'+qtyLabel+' ✓</span>' : qtyLabel}</td>
                      <td><span class="status-badge status-${po.status==='입고완료'?'배송완료':po.status==='취소'?'취소':'결제완료'}">${po.status}</span></td>
                      <td class="font-semibold">${fmt(po.totalAmount||0)}</td>
                      <td class="text-[12px] text-warm-400 max-w-[120px] truncate">${escapeHtml(po.memo||'')}</td>
                      <td class="text-warm-400 text-[12px]">${ds}</td>
                      <td class="flex gap-1"><button class="btn-primary btn-sm" onclick="openPODetailModal(${po.id})">상세</button><button class="btn-outline btn-sm text-red-500 border-red-300 hover:bg-red-50" onclick="deletePO(${po.id},'${escapeHtml(po.poNo)}')">삭제</button></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
          ${totalPages > 1 ? `
            <div class="flex justify-center gap-2 mt-6">
              ${poPage > 1 ? `<button class="btn-outline btn-sm" onclick="poPage--;renderPurchaseOrders(document.getElementById('page-content'))">← 이전</button>` : ''}
              <span class="text-[13px] text-warm-500 flex items-center px-4">${poPage} / ${totalPages}</span>
              ${poPage < totalPages ? `<button class="btn-outline btn-sm" onclick="poPage++;renderPurchaseOrders(document.getElementById('page-content'))">다음 →</button>` : ''}
            </div>
          ` : ''}
        </div>
      `;
    } catch (e) {
      el.innerHTML = '<p class="py-20 text-center text-warm-400">발주 목록을 불러오는 중 오류가 발생했습니다.</p>';
    }
  }

  let poItems = [];
  let poAllProducts = [];

  async function openPOModal() {
    poItems = [{ productId:null, productName:'', colorName:'', sizeName:'', qty:1, costPrice:0 }];
    let vendors = [];
    try { vendors = await api('/admin/vendors'); } catch(e) {}
    try { poAllProducts = await api('/admin/products'); } catch(e) { poAllProducts = []; }
    const modal = document.createElement('div');
    modal.className = 'overlay';
    modal.id = 'po-modal';
    modal.innerHTML = `
      <div class="overlay-content p-6" style="max-width:640px;" onclick="event.stopPropagation()">
        <div class="flex justify-between items-center mb-6">
          <h3 class="font-serif text-lg font-semibold text-warm-800 italic">발주서 작성</h3>
          <button onclick="document.getElementById('po-modal').remove()" class="text-warm-400 hover:text-warm-700 bg-transparent border-none cursor-pointer text-xl">&times;</button>
        </div>
        <form onsubmit="return false;" class="space-y-4">
          <div>
            <label class="text-[11px] font-semibold tracking-wider text-warm-500 block mb-1">거래처 *</label>
            <select id="po-vendor" class="input-field" onchange="onPOVendorChange()">
              <option value="">선택</option>
              ${vendors.map(v => `<option value="${v.id}">${escapeHtml(v.name)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="text-[11px] font-semibold tracking-wider text-warm-500 block mb-1">메모</label>
            <textarea id="po-memo" class="input-field resize-none" rows="2"></textarea>
          </div>
          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="text-[11px] font-semibold tracking-wider text-warm-500">발주 품목</label>
              <button type="button" class="btn-outline btn-sm" onclick="addPOItem()">+ 품목 추가</button>
            </div>
            <div id="po-items-list"></div>
          </div>
          <button class="btn-primary w-full" onclick="savePO()">발주서 생성</button>
        </form>
      </div>
    `;
    modal.addEventListener('mousedown', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
    renderPOItems();
  }

  function onPOVendorChange() {
    // 거래처 변경 시 품목 초기화 후 재렌더
    poItems = [{ productId:null, productName:'', colorName:'', sizeName:'', qty:1, costPrice:0 }];
    renderPOItems();
  }

  function getVendorProducts() {
    const vendorId = document.getElementById('po-vendor')?.value;
    if (!vendorId) return poAllProducts;
    return poAllProducts.filter(p => String(p.vendorId) === String(vendorId));
  }

  function onPOProductSelect(idx) {
    const sel = document.getElementById('po-product-sel-' + idx);
    if (!sel) return;
    const pid = parseInt(sel.value);
    const prod = poAllProducts.find(p => p.id === pid);
    if (prod) {
      poItems[idx].productId = prod.id;
      poItems[idx].productName = prod.name;
      poItems[idx].costPrice = prod.costPrice || 0;
      // 색상/사이즈 선택 옵션 업데이트
      renderPOItems();
    }
  }

  function addPOItem() { poItems.push({ productId:null, productName:'', colorName:'', sizeName:'', qty:1, costPrice:0 }); renderPOItems(); }
  function removePOItem(i) { poItems.splice(i,1); renderPOItems(); }
  function renderPOItems() {
    const list = document.getElementById('po-items-list');
    if (!list) return;
    const vendorProducts = getVendorProducts();
    list.innerHTML = poItems.map((item,i) => {
      const selectedProd = poAllProducts.find(p => p.id === item.productId);
      const colors = selectedProd ? (selectedProd.colors || []) : [];
      const sizeStr = selectedProd ? (selectedProd.size || '') : '';
      const sizes = sizeStr ? sizeStr.split(',').map(s => s.trim()).filter(Boolean) : [];
      return `
      <div class="border border-warm-200 rounded p-3 mb-2 relative" onclick="event.stopPropagation()">
        ${poItems.length > 1 ? `<button type="button" onclick="removePOItem(${i})" class="absolute top-1 right-2 text-red-400 hover:text-red-600 bg-transparent border-none cursor-pointer">&times;</button>` : ''}
        <div class="mb-2">
          <select id="po-product-sel-${i}" class="input-field" onchange="onPOProductSelect(${i})">
            <option value="">상품 선택</option>
            ${vendorProducts.map(p => `<option value="${p.id}" ${p.id===item.productId?'selected':''}>${escapeHtml(p.name)}${p.costPrice ? ' ('+fmt(p.costPrice)+')' : ''}</option>`).join('')}
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2 mb-2">
          ${colors.length > 0 ? `
            <select class="input-field" onchange="poItems[${i}].colorName=this.value">
              <option value="">색상 선택</option>
              ${colors.map(c => `<option value="${escapeHtml(c.name)}" ${c.name===item.colorName?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
            </select>
          ` : `<input class="input-field" placeholder="색상" value="${escapeHtml(item.colorName)}" onblur="poItems[${i}].colorName=this.value" />`}
          ${sizes.length > 0 ? `
            <select class="input-field" onchange="poItems[${i}].sizeName=this.value">
              <option value="">사이즈 선택</option>
              ${sizes.map(s => `<option value="${escapeHtml(s)}" ${s===item.sizeName?'selected':''}>${escapeHtml(s)}</option>`).join('')}
            </select>
          ` : `<input class="input-field" placeholder="사이즈" value="${escapeHtml(item.sizeName)}" onblur="poItems[${i}].sizeName=this.value" />`}
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-warm-400 block mb-1">수량</label>
            <input type="number" class="input-field" placeholder="수량" value="${item.qty}" min="1" onblur="poItems[${i}].qty=parseInt(this.value)||1" />
          </div>
          <div>
            <label class="text-[10px] text-warm-400 block mb-1">매입가</label>
            <input type="number" class="input-field" placeholder="매입가" value="${item.costPrice}" min="0" onblur="poItems[${i}].costPrice=parseInt(this.value)||0" />
          </div>
        </div>
      </div>
    `}).join('');
  }

  async function savePO() {
    const vendorId = document.getElementById('po-vendor').value;
    if (!vendorId) { showToast('거래처를 선택해주세요'); return; }
    const memo = document.getElementById('po-memo').value.trim();
    const items = poItems.filter(i => i.productName || i.productId);
    if (items.length === 0) { showToast('품목을 최소 1개 선택해주세요'); return; }
    try {
      await api('/admin/purchase-orders', {
        method: 'POST',
        body: JSON.stringify({ vendorId: parseInt(vendorId), memo, items })
      });
      showToast('발주서가 생성되었습니다');
      document.getElementById('po-modal').remove();
      renderPurchaseOrders(document.getElementById('page-content'));
    } catch (e) { showToast(e.message || '발주서 생성에 실패했습니다'); }
  }

  let poEditMode = false;
  let poEditItems = [];

  async function openPODetailModal(poId) {
    try {
      const data = await api('/admin/purchase-orders/' + poId);
      const po = data.purchaseOrder;
      poEditMode = false;
      poEditItems = (po.items || []).map(it => ({
        id: it.id || null,
        productId: it.productId || null,
        productName: it.productName || '',
        colorName: it.colorName || '',
        sizeName: it.sizeName || '',
        qty: it.qty || 1,
        costPrice: it.costPrice || 0,
        receivedQty: it.receivedQty || 0,
      }));
      // 편집용 상품 목록 로드
      try { poAllProducts = await api('/admin/products'); } catch(e) { poAllProducts = []; }
      const modal = document.createElement('div');
      modal.className = 'overlay';
      modal.id = 'po-detail-modal';
      modal.setAttribute('data-po-id', poId);
      modal.setAttribute('data-po-no', po.poNo);
      modal.setAttribute('data-vendor-name', po.vendorName || '');
      modal.setAttribute('data-po-status', po.status);
      const statuses = ['발주대기','입고완료'];
      modal.innerHTML = `
        <div class="overlay-content p-6" style="max-width:640px;" onclick="event.stopPropagation()">
          <div class="flex justify-between items-center mb-6">
            <h3 class="font-serif text-lg font-semibold text-warm-800 italic">발주 상세 - ${escapeHtml(po.poNo)}</h3>
            <button onclick="document.getElementById('po-detail-modal').remove()" class="text-warm-400 hover:text-warm-700 bg-transparent border-none cursor-pointer text-xl">&times;</button>
          </div>
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div><span class="text-[11px] text-warm-400 block">거래처</span><span class="font-semibold">${escapeHtml(po.vendorName||'')}</span></div>
            <div><span class="text-[11px] text-warm-400 block">총 금액</span><span class="font-semibold" id="po-detail-total">${fmt(po.totalAmount||0)}</span></div>
          </div>
          <div class="mb-4">
            <label class="text-[11px] font-semibold tracking-wider text-warm-500 block mb-1">상태 변경</label>
            <select id="po-detail-status" class="input-field" onchange="onPOStatusChange(this.value)">
              ${statuses.map(s => `<option value="${s}" ${s===po.status?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>
          <div class="mb-4">
            <label class="text-[11px] font-semibold tracking-wider text-warm-500 block mb-1">메모</label>
            <textarea id="po-detail-memo" class="input-field resize-none" rows="2">${escapeHtml(po.memo||'')}</textarea>
          </div>
          <div class="flex justify-between items-center mb-2">
            <h4 class="font-semibold text-warm-800 text-[13px]">발주 품목</h4>
            <button class="btn-outline btn-sm" id="po-edit-toggle" onclick="togglePOEdit()">수정</button>
          </div>
          <div id="po-detail-items-area" class="overflow-x-auto mb-4">
            ${renderPODetailItemsView(po.items)}
          </div>
          <button class="btn-primary w-full" onclick="savePODetail(${po.id})">저장</button>
        </div>
      `;
      modal.addEventListener('mousedown', e => { if (e.target === modal) modal.remove(); });
      document.body.appendChild(modal);
    } catch (e) { showToast(e.message || '발주 상세를 불러올 수 없습니다'); }
  }

  function renderPODetailItemsView(items) {
    const poStatus = document.getElementById('po-detail-modal')?.getAttribute('data-po-status') || '';
    const showReceived = poStatus === '입고완료';
    return `<table>
      <thead><tr><th>상품명</th><th>색상</th><th>사이즈</th><th>수량</th>${showReceived ? '<th>입고수량</th>' : ''}<th>매입가</th><th>소계</th></tr></thead>
      <tbody>
        ${(items||[]).map((it, idx) => `
          <tr>
            <td>${escapeHtml(it.productName)}</td>
            <td>${escapeHtml(it.colorName||'')}</td>
            <td>${escapeHtml(it.sizeName||'')}</td>
            <td>${it.qty}</td>
            ${showReceived ? `<td><input type="number" class="input-field" style="width:70px;padding:4px 6px;text-align:center" value="${it.receivedQty || 0}" min="0" max="${it.qty}" onchange="poEditItems[${idx}].receivedQty=parseInt(this.value)||0" /></td>` : ''}
            <td>${fmt(it.costPrice)}</td>
            <td class="font-semibold">${fmt(it.subtotal || (it.qty||0) * (it.costPrice||0))}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
  }

  function onPOStatusChange(newStatus) {
    const modal = document.getElementById('po-detail-modal');
    if (modal) modal.setAttribute('data-po-status', newStatus);
    // 입고완료 선택 시 입고수량이 0인 품목은 발주수량으로 자동 세팅
    if (newStatus === '입고완료') {
      poEditItems.forEach(i => {
        if (!i.receivedQty || i.receivedQty === 0) i.receivedQty = i.qty || 0;
      });
    }
    const area = document.getElementById('po-detail-items-area');
    if (area) {
      if (poEditMode) {
        renderPODetailItemsEdit();
      } else {
        area.innerHTML = renderPODetailItemsView(poEditItems);
      }
    }
  }

  function togglePOEdit() {
    poEditMode = !poEditMode;
    const btn = document.getElementById('po-edit-toggle');

    const sel = document.getElementById('po-edit-product-sel-' + idx);

    const pid = parseInt(sel.value);
    const prod = poAllProducts.find(p => p.id === pid);
    if (prod) {

      poEditItems[idx].productName = prod.name;
      poEditItems[idx].costPrice = prod.costPrice || 0;
      poEditItems[idx].colorName = '';
      poEditItems[idx].sizeName = '';
      renderPODetailItemsEdit();
      updatePOEditTotal();
    }
  }

    const total = poEditItems.reduce((s,i) => s + (i.qty||1) * (i.costPrice||0), 0);
    const el = document.getElementById('po-detail-total');
    if (el) el.textContent = fmt(total);

  function validatePOEditCostPrice(idx) {
    const el = document.getElementById('po-edit-cost-' + idx);
    if (!el) return;
    if (!poEditItems[idx].costPrice || poEditItems[idx].costPrice <= 0) {
      el.style.border = '1.5px solid #e53e3e';
      el.style.background = '#fff5f5';
      el.focus();
    } else {
      el.style.border = '';

  async function savePODetail(poId) {
    const status = document.getElementById('po-detail-status').value;
    const memo = document.getElementById('po-detail-memo').value.trim();
    const body = { status, memo };
    if (poEditMode) {
      body.items = poEditItems.filter(i => i.productName);
      if (body.items.length === 0) { showToast('품목을 최소 1개 입력해주세요'); return; }
      const invalidIdx = body.items.findIndex(i => !i.costPrice || i.costPrice <= 0);
      if (invalidIdx >= 0) {
        showToast('매입가를 입력해주세요');
        validatePOEditCostPrice(invalidIdx);
        return;
      }
    }
    // 입고 수량 전달 (입고완료 상태일 때)
    if (status === '입고완료') {
      const totalReceived = poEditItems.reduce((s, i) => s + (i.receivedQty || 0), 0);
      if (totalReceived === 0) {
        if (!confirm('입고수량이 모두 0입니다. 전량 입고로 처리할까요?')) return;
        poEditItems.forEach(i => { i.receivedQty = i.qty || 0; });
      }
      const receivedItems = poEditItems.filter(i => i.id).map(i => ({
        id: i.id,
        receivedQty: i.receivedQty || 0,
      }));
      if (receivedItems.length > 0) body.receivedItems = receivedItems;
    }
    try {
      const result = await api('/admin/purchase-orders/' + poId, { method: 'PATCH', body: JSON.stringify(body) });
      if (result.allocation && result.allocation.allocated > 0) {
        showToast(`저장 완료 - ${result.allocation.orders}건 주문에 ${result.allocation.allocated}개 배정됨`);
      } else {
        showToast('발주서가 저장되었습니다');
      }
      document.getElementById('po-detail-modal').remove();
      renderPurchaseOrders(document.getElementById('page-content'));
    } catch (e) { showToast(e.message || '저장에 실패했습니다'); }
  }

    if (!confirm(`발주서 ${poNo}을(를) 삭제하시겠습니까?`)) return;
    try {
      await api('/admin/purchase-orders/' + poId, { method: 'DELETE' });

      renderPurchaseOrders(document.getElementById('page-content'));
    } catch (e) { showToast(e.message || '삭제에 실패했습니다'); }

  let salesTab = 'daily';

  let salesTo = '';
